[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true  # required: Uniswap v4 integration + deploy script hit "stack too deep" without it

# Robinhood Chain RPCs — fill in real endpoints before use.
[rpc_endpoints]
rhc_testnet = "${RHC_TESTNET_RPC_URL}"
rhc_mainnet = "${RHC_MAINNET_RPC_URL}"

# See https://book.getfoundry.sh/reference/config/ for full options.
