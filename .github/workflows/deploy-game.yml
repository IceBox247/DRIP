name: Deploy Grid Mine

# Deploy the Grid Mine contracts from your phone — no laptop needed.
# GitHub runs Foundry in the cloud; you just press "Run workflow" and read the printed addresses.
#
# ONE-TIME SETUP (on the phone):
#   1. Make a throwaway wallet (a fresh MetaMask account — NOT your main one). Copy its private key.
#   2. Fund that wallet with a little TESTNET gas on Robinhood Chain testnet.
#   3. Repo → Settings → Secrets and variables → Actions → New repository secret:
#         name:  DEPLOYER_PRIVATE_KEY
#         value: the throwaway key (0x...)
#      (Optional, for mainnet only: USDG_ADDRESS, NVDA_ADDRESS, SWAP_ROUTER, RANDOMNESS.)
#
# TO DEPLOY:
#   Repo → Actions → "Deploy Grid Mine" → Run workflow → pick "testnet" → Run.
#   When it finishes, open the run → its Summary lists the 6 addresses. Paste them into Vercel.

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Which network to deploy to"
        type: choice
        options: [testnet, mainnet]
        default: testnet
      swap_mode:
        description: "How the reward engine buys DRIP/NVDA. 'pons' = real Pons curve + Uniswap v4 (mainnet). 'mock' = fixed-rate test router."
        type: choice
        options: [mock, pons]
        default: mock
      usdg:
        description: "USDG token address (blank = deploy a mock). Mainnet real USDG: 0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
        type: string
        default: ""
      drip:
        description: "Existing DRIP token to use (blank = deploy our DripToken). Must have burn(uint256)."
        type: string
        default: ""
      nvda:
        description: "NVDA token address (blank = deploy a mock). Mainnet real NVDA: 0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC"
        type: string
        default: ""
      pons_curve:
        description: "DRIP's Pons bonding curve (pons mode). Blank uses the FLYCOINHUNT curve default."
        type: string
        default: ""
      seed_drip:
        description: "MOCK mode only: whole DRIP tokens to seed the mock router (needs the deployer to hold them)."
        type: string
        default: "100000"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install pinned contract dependencies
        working-directory: contracts
        run: |
          set -eo pipefail
          # lib/ is gitignored (not in the repo), so fetch the exact versions the code was built with.
          rm -rf lib && mkdir -p lib
          git clone --recurse-submodules https://github.com/foundry-rs/forge-std lib/forge-std
          git -C lib/forge-std checkout 16cb9c998736cab8f14aebd5199cdf6a02fde055
          git -C lib/forge-std submodule update --init --recursive
          git clone --branch v5.1.0 --depth 1 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
          forge build   # fail here (red) if anything doesn't compile — no more silent success

      - name: Deploy contracts
        working-directory: contracts
        env:
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          # Token/router config from the workflow inputs (fall back to secrets if inputs are blank).
          USDG: ${{ inputs.usdg != '' && inputs.usdg || secrets.USDG_ADDRESS }}
          DRIP: ${{ inputs.drip }}
          NVDA: ${{ inputs.nvda != '' && inputs.nvda || secrets.NVDA_ADDRESS }}
          SEED_DRIP: ${{ inputs.seed_drip }}
          SWAP_MODE: ${{ inputs.swap_mode }}
          PONS_CURVE: ${{ inputs.pons_curve }}
          SWAP_ROUTER: ${{ secrets.SWAP_ROUTER }}
          RANDOMNESS: ${{ secrets.RANDOMNESS }}
        run: |
          set -eo pipefail   # so a forge failure fails the step (tee no longer masks it)
          if [ -z "$DEPLOYER_PRIVATE_KEY" ]; then
            echo "::error::DEPLOYER_PRIVATE_KEY secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          # Blank address envs must be UNSET (not "") so the script's vm.envOr defaults kick in.
          for v in USDG DRIP NVDA PONS_CURVE SWAP_ROUTER RANDOMNESS; do
            eval "[ -z \"\${$v}\" ] && unset $v || true"
          done
          if [ "${{ inputs.network }}" = "mainnet" ]; then
            RPC="https://rpc.mainnet.chain.robinhood.com"
            # On mainnet, force the REAL Pons integration and the real tokens unless explicitly
            # overridden — so a plain "network: mainnet" run can never fall back to mocks.
            SWAP_MODE=pons
            : "${USDG:=0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168}"
            : "${NVDA:=0xd0601CE157Db5bdC3162BbaC2a2C8aF5320D9EEC}"
            : "${DRIP:=0x8f519e3e55b44014d6dd323bb3de561bf6cb6f1c}"
            export SWAP_MODE USDG NVDA DRIP
            echo "MAINNET: swap_mode=pons, USDG=$USDG, NVDA=$NVDA, DRIP=$DRIP"
            echo "::warning::Deploying to MAINNET with the REAL Pons curve + NVDA v4 pool. Uses mock RNG unless RANDOMNESS is set — controlled test only, not public (blocker #1)."
          else
            RPC="https://rpc.testnet.chain.robinhood.com"
          fi
          echo "Deploying to ${{ inputs.network }} ($RPC)"
          forge script script/DeployGame.s.sol:DeployGame \
            --rpc-url "$RPC" \
            --private-key "$DEPLOYER_PRIVATE_KEY" \
            --broadcast --slow | tee /tmp/deploy.log
          # A real deploy prints the GridMine address; if it's missing, fail loudly.
          grep -qE "GridMine[: ]+0x[0-9a-fA-F]{40}" /tmp/deploy.log || {
            echo "::error::Deploy produced no GridMine address — check the log above (usually: deployer wallet has no testnet gas, or RPC unreachable).";
            exit 1;
          }

      - name: Collect addresses
        if: always()
        working-directory: contracts
        run: |
          {
            echo "## Deployed to ${{ inputs.network }}"
            echo ""
            echo "Paste these into Vercel → Settings → Environment Variables, then redeploy."
            echo ""
            echo '```'
            grep -E "USDG=|NVDA=|DripToken|GridMine|RefiningVault|StakeVault|MockSwapRouter|PonsSwapAdapter|Pons curve|NVDA v4 pool|MockRandomness|CommitReveal" /tmp/deploy.log || echo "No addresses found — check the deploy step log above for errors."
            echo '```'
            echo ""
            # In pons mode USDG/NVDA are the real tokens passed in (echoed on the MAINNET: line);
            # in mock mode they're deployed (MockERC20 USDG:/NVDA: lines). Try both.
            cfg=$(grep -E "^MAINNET:" /tmp/deploy.log | tail -1)
            u=$(echo "$cfg" | grep -oiE "USDG=0x[0-9a-fA-F]{40}" | grep -oE "0x[0-9a-fA-F]{40}")
            n=$(echo "$cfg" | grep -oiE "NVDA=0x[0-9a-fA-F]{40}" | grep -oE "0x[0-9a-fA-F]{40}")
            [ -z "$u" ] && u=$(grep -E "MockERC20 USDG:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            [ -z "$n" ] && n=$(grep -E "MockERC20 NVDA:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            d=$(grep -E "DripToken:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            g=$(grep -E "GridMine:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            r=$(grep -E "RefiningVault:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            s=$(grep -E "StakeVault:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            rng=$(grep -E "MockRandomness:|CommitRevealRandomness:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            pons=$(grep -E "PonsSwapAdapter:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            mockr=$(grep -E "MockSwapRouter:" /tmp/deploy.log | grep -oE "0x[0-9a-fA-F]{40}" | tail -1)
            echo "| Vercel env var | value |"
            echo "|---|---|"
            echo "| NEXT_PUBLIC_CHAIN_ID | $([ "${{ inputs.network }}" = "mainnet" ] && echo 4663 || echo 46630) |"
            echo "| NEXT_PUBLIC_USDG_ADDRESS | $u |"
            echo "| NEXT_PUBLIC_NVDA_ADDRESS | $n |"
            echo "| NEXT_PUBLIC_DRIP_ADDRESS | $d |"
            echo "| NEXT_PUBLIC_GRIDMINE_ADDRESS | $g |"
            echo "| NEXT_PUBLIC_REFINING_ADDRESS | $r |"
            echo "| NEXT_PUBLIC_STAKE_ADDRESS | $s |"
            echo "| NEXT_PUBLIC_RANDOMNESS_ADDRESS | $rng |"
            echo ""
            if [ -n "$pons" ]; then
              echo "> ✅ **Real Pons integration.** Swap router (PonsSwapAdapter): **$pons** — buys DRIP from the Pons curve and NVDA from its Uniswap v4 pool. No seeding needed."
            elif grep -q "SEED FAILED" /tmp/deploy.log; then
              echo "> ⚠️ **Mock router not seeded** — send DRIP to **$mockr** from the wallet that holds it, or per-round buys revert."
            else
              echo "> Mock swap router (seeded): **$mockr** — test router, not real pools."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
